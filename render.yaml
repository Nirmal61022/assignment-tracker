services:
  - type: web
    name: assignment-tracker
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: assignment-tracker-db
          property: connectionString

databases:
  - name: assignment-tracker-db
    databaseName: assignment_tracker
    user: tracker_user
    plan: free
